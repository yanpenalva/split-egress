name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install dependencies
        run: sudo apt-get update && sudo apt-get install -y dnsutils jq shellcheck
      - name: lint
        run: shellcheck -e SC1090 bin/egress-check scripts/*.sh tests/*.sh
      - name: test
        run: make test
